<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .negoce-text {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-weight: 700;
        font-size: 7px;
        fill: #22c55e;
        text-transform: capitalize;
      }
      .cooperation-text {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-weight: 700;
        font-size: 6px;
        fill: #1e40af;
        text-transform: capitalize;
      }
      .sarl-text {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-weight: 700;
        font-size: 5px;
        fill: #1e40af;
        text-transform: capitalize;
      }
    </style>
  </defs>
  
  <!-- Fond blanc -->
  <rect width="32" height="32" fill="#ffffff"/>
  
  <!-- Texte Négoce en vert -->
  <text x="2" y="10" class="negoce-text">Négoce</text>
  
  <!-- Texte Coopération en bleu -->
  <text x="2" y="18" class="cooperation-text">Coopération</text>
  
  <!-- Texte Sarl en bleu -->
  <text x="2" y="25" class="sarl-text">Sarl</text>
</svg>

