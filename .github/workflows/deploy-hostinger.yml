name: Deploy frontend to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-static-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish build to deploy/hostinger
        run: |
          set -euo pipefail

          deploy_dir="$RUNNER_TEMP/hostinger-build"
          mkdir -p "$deploy_dir"
          cp -a frontend/build/. "$deploy_dir/"

          remote_ref="$(git ls-remote --heads origin refs/heads/deploy/hostinger)"
          if [ -n "$remote_ref" ]; then
            git fetch origin refs/heads/deploy/hostinger:refs/remotes/origin/deploy/hostinger
            git checkout -B deploy/hostinger refs/remotes/origin/deploy/hostinger
          else
            git checkout -b deploy/hostinger "$GITHUB_SHA"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -f --ignore-unmatch .
          git clean -fdx
          cp -a "$deploy_dir/." .
          git add --all

          if git diff --cached --quiet; then
            echo "The generated frontend is unchanged; nothing to publish."
            exit 0
          fi

          git commit -m "Deploy frontend from ${GITHUB_SHA}"
          git push origin HEAD:refs/heads/deploy/hostinger
